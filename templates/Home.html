<!DOCTYPE html>
<html lang="en">
   <head>
      <!-- basic -->
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <!-- mobile metas -->
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="viewport" content="initial-scale=1, maximum-scale=1">
      <!-- site metas -->
      <title>SocialNet</title>
      <meta name="keywords" content="">
      <meta name="description" content="">
      <meta name="author" content="">
      <!-- bootstrap css -->
      <link rel="stylesheet" href="static/css/bootstrap.min.css">
      <!-- style css -->
      <link rel="stylesheet" href="static/css/style.css">
      <!-- Responsive-->
      <link rel="stylesheet" href="static/css/responsive.css">
      <!-- fevicon -->
      <link rel="icon" href="static/images/fevicon.png" type="image/gif" />
      <!-- Scrollbar Custom CSS -->
      <link rel="stylesheet" href="static/css/jquery.mCustomScrollbar.min.css">
      <!-- Tweaks for older IEs-->
      <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css" media="screen">
      <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script><![endif]-->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

       <style>
          /* Post Card */
.post-card {
  max-width: 600px;
  margin: 20px auto;
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  font-family: Arial, sans-serif;
}

/* Header */
.post-header {
  margin-bottom: 12px;
}
.post-username {
  font-weight: 600;
  font-size: 16px;
  color: #050505;
}
.post-info {
  font-size: 14px;
  color: #65676b;
  margin-top: 4px;
}

/* Post Image */
.post-image img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  margin-top: 10px;
}

/* Actions */
.post-actions {
  display: flex;
  justify-content: space-around;
  border-top: 1px solid #ddd;
  margin-top: 12px;
  padding-top: 10px;
}
.post-actions .action {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  color: #65676b;
  transition: color 0.2s;
}
.post-actions .action img {
  width: 18px;
  height: 18px;
}
.post-
.post-actions {
  display: flex;
  justify-content: space-around;
  border-top: 1px solid #ddd;
  margin-top: 12px;
  padding-top: 10px;
}

.post-actions .action {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  color: #65676b;
  transition: color 0.2s;
}

.post-actions .action i {
  font-size: 16px;
}

.post-actions .action:hover {
  color: #1877f2;
}


       </style>
   </head>
   <!-- body -->
   <body class="main-layout">
      <!-- loader  -->
      <div class="loader_bg">
         <div class="loader"><img src="static/images/loading.gif" alt="#"/></div>
      </div>
      <!-- end loader -->
      <!-- header -->
      <header>
         <!-- header inner -->
         <div class="header">
            <div class="container-fluid">
               <div class="row">
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col logo_section">
                     <div class="full">
                        <div class="center-desk">
                           <div class="logo">
                              <h1 style="color:white;font-size:xx-large;">Social Net</h1>
                           </div>
                        </div>
                     </div>
                  </div>
                  <div class="col-xl-7 col-lg-7 col-md-9 col-sm-9">
                     <nav class="navigation navbar navbar-expand-md navbar-dark ">
                        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExample04" aria-controls="navbarsExample04" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarsExample04">
                           <ul class="navbar-nav mr-auto">
                              {% include 'menu/user.html'  %}
                           </ul>
                        </div>
                     </nav>
                  </div>
               </div>
            </div>
         </div>
      </header>
      <!-- end header inner -->
      <!-- end header -->
        <div class="back_re">
         <div class="container">
            <div class="row">
               <div class="col-md-12">
                  <div class="title">
                      <h2>User Post</h2>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <!--  contact -->
      <div class="contact">
  <div class="container" style="margin-left:15%;margin-bottom :15%;">
    <div class="row">
      <div class="col-md-10 offset-md-1">

        <div class="table-responsive">
         <form action="" method="post" name="form">

  {% for item in data %}
  <div class="post-card">
    <!-- User Info -->
    <div class="post-header">
      <div class="post-username">UserName: {{item[1]}}</div>
      <div class="post-info">Info: {{item[2]}}</div>
    </div>

    <!-- Post Image -->
    <div class="post-image">
      <img src="static/upload/{{item[3]}}" alt="Post Image">
    </div>

    <!-- Post Actions -->
    <div class="post-actions">
      <a href="/cmt?act=snt&id={{item[0]}}" class="action">
        <i class="fa-regular fa-comment"></i> Comment
      </a>
      <a href="/share?id={{item[0]}}" class="action">
        <i class="fa-solid fa-share"></i> Share
      </a>
    </div>

  </div>
  {% endfor %}

</form>



        </div>

      </div>
    </div>
  </div>
</div>

      <!-- end contact -->
      <!--  footer -->
      <footer>
         <div class="footer">
            <h1 style="color:white;font-size:xx-large;">Social Net</h1>
            <div class="copyright">
               <div class="container">
                  <div class="row">
                     <div class="col-md-10 offset-md-1">
                        <p>© <script>document. write( new Date(). getFullYear() );</script> All Rights Reserved.</p>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </footer>
      <!-- end footer -->
      <!-- Javascript files-->
      <script src="static/js/jquery.min.js"></script>
      <script src="static/js/bootstrap.bundle.min.js"></script>
      <script src="static/js/jquery-3.0.0.min.js"></script>
      <!-- sidebar -->
      <script src="static/js/jquery.mCustomScrollbar.concat.min.js"></script>
      <script src="static/js/custom.js"></script>
   <!--flash Start-->
   {% with messages = get_flashed_messages() %}
  {% if messages %}
    <script>
      var messages = {{ messages | safe }};
      for (var i=0; i<messages.length; i++) {
        alert(messages[i]);
      }
    </script>
  {% endif %}
{% endwith %}
    <!--flash End-->

   </body>
</html>
