          /* Form container */
.post-form {
  max-width: 600px;
  margin: 20px auto;
  padding: 20px 25px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* Form title */
.form-title {
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: 18px;
  color: #1c1e21;
  border-bottom: 1px solid #ddd;
  padding-bottom: 6px;
}

/* Group */
.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
}
.form-group label {
  font-weight: 500;
  margin-bottom: 6px;
  color: #333;
}

/* Inputs */
.input-file,
textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
